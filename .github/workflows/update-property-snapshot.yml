name: Update property snapshot

on:
  schedule:
    # Every Monday morning. GitHub Actions schedules use UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-property-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh WordPress property snapshot
        run: npm run update:property-snapshot

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- public/property-search-index.json; then
            echo "Property snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/property-search-index.json
          git commit -m "Refresh weekly property snapshot"
          git push
